# ============================================================
# registry.yaml — Hồ sơ nhân vật
# File này được agent tạo tự động, user review và điều chỉnh.
# ĐÂY LÀ FILE QUAN TRỌNG NHẤT — quyết định chất lượng xưng hô.
# ============================================================
#
# Hướng dẫn:
# - Agent sẽ quét raw chapters và tạo file này
# - User CẦN review và sửa nếu cần
# - Khi phát hiện nhân vật mới trong quá trình dịch, agent sẽ bổ sung
# - Các trường có dấu (*) là BẮT BUỘC
#
# Vai trò (role):
#   male_lead     = Nam chính
#   female_lead   = Nữ chính
#   male_second   = Nam phụ
#   female_second = Nữ phụ
#   supporting    = Nhân vật phụ
#   antagonist    = Phản diện
#   minor         = Nhân vật thoáng qua
#
# ============================================================

