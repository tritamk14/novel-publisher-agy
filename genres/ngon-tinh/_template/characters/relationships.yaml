# ============================================================
# HƯỚNG DẪN CHO AGENT KHI DỊCH:
#
# 1. Trước khi dịch mỗi chương, xác định chương hiện tại
# 2. Tra relationships.yaml để tìm phase đang active cho mỗi cặp nhân vật
