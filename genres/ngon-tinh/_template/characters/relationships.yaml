# ============================================================
# relationships.yaml — Ma trận xưng hô
# Định nghĩa cách từng nhân vật xưng hô với nhau,
# THAY ĐỔI theo tiến trình truyện (phases).
#
# ĐÂY LÀ CƠ CHẾ CHỐNG LOẠN XƯNG HÔ.
# ============================================================
#
# Cấu trúc:
#   speaker → listener → phase → (tự xưng, gọi đối phương)
#
# Mỗi "phase" đại diện cho một giai đoạn quan hệ:
#   - Khoảng chương áp dụng
#   - Cách tự xưng của speaker
#   - Cách speaker gọi listener
#
# QUAN TRỌNG:
#   - Xưng hô trong đối thoại (dialogue) khác với tường thuật (narration)
#   - File này chỉ định xưng hô trong ĐỐI THOẠI
#   - Xưng hô trong tường thuật lấy từ registry.yaml → self_reference.internal
#
# ============================================================

relationships: []

