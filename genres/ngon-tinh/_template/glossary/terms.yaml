# ============================================================
# terms.yaml — Bảng thuật ngữ cố định
# Đảm bảo các thuật ngữ được dịch nhất quán xuyên suốt truyện.
# ============================================================
#
# Agent sẽ khởi tạo file này khi trích xuất nhân vật.
# User có thể bổ sung bất cứ lúc nào.
# Agent PHẢI tra cứu file này trước khi dịch mỗi chương.
#
# Các loại thuật ngữ:
#   names      = Tên người (đã có trong registry, nhưng lặp lại ở đây cho tiện)
#   places     = Địa danh
#   titles     = Chức danh, danh xưng
#   orgs       = Tổ chức, công ty
#   objects    = Vật phẩm đặc biệt
#   concepts   = Khái niệm, thuật ngữ chuyên ngành
#   idioms     = Thành ngữ đặc thù (dịch cố định)
#   cultural   = Thuật ngữ văn hóa
# ============================================================

terms: []

