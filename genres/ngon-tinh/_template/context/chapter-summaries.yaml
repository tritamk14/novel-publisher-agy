# ============================================================
# chapter-summaries.yaml — Tóm tắt nội dung từng chương
# Agent tự động cập nhật sau khi dịch xong mỗi chương.
# Dùng để duy trì ngữ cảnh liên tục giữa các chương.
# ============================================================
#
# Mỗi entry gồm:
#   - chapter: tên file chương
#   - summary: tóm tắt ngắn (3-5 câu) nội dung chính
#   - characters_present: nhân vật xuất hiện (dùng ID từ registry)
#   - key_events: sự kiện quan trọng
#   - relationship_changes: thay đổi quan hệ (nếu có)
#   - location: địa điểm chính
#   - mood: tông cảm xúc chương
#   - cliffhanger: điểm treo cuối chương (nếu có)
#
# QUAN TRỌNG: Agent PHẢI đọc tóm tắt 2-3 chương trước
# khi bắt đầu dịch chương tiếp theo.
# ============================================================

summaries: []

