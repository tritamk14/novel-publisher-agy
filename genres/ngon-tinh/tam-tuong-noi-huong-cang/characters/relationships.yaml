# ============================================================
# GHI CHÚ TỔNG HỢP:
#
# 1. "妹妹仔" (bé) là cách gọi SIGNATURE của Tống Bạc Lễ cho Thẩm Tường
#    Xuyên suốt truyện, ý nghĩa thay đổi:
#    - Đầu: coi như trẻ con, chiếu cố → sắc thái coi nhẹ
#    - Sau chia tay: nhớ nhung, tiếc nuối → sắc thái đau đớn
#    - Truy đuổi: dần trở thành lời yêu chân thành
#    - Tái hợp+: "bé" = lời yêu thương sâu nhất → sắc thái sủng
#
# 2. "Tống Đổng" (宋董) là cách Thẩm Tường giữ khoảng cách
#    Khi cô gọi tên đầy đủ "Tống Bạc Lễ" = bước ngoặt cảm xúc
#
# 3. Chương 47 là PIVOTAL — cô tha thứ, đánh dấu chuyển phase
#    Chương 68-69 là PIVOTAL — tái hợp chính thức
#    Chương 82 là PIVOTAL — đám cưới
# ============================================================
