      intimate: "em"
      internal: "cô"

    notes: |
      - Tên 蔷 nghĩa là hoa tường vi (蔷薇) — biểu tượng xuyên suốt truyện
      - Tên nghệ danh quốc tế: Irene
      - Kỹ thuật đặc trưng: hoa ty khảm nhương (花丝镶嵌 - filigree inlay)
      - Mẹ gọi bằng "囡囡" → dịch "con gái" (cách gọi thân mật vùng Giang Nam)
      - Tống Bạc Lễ gọi bằng "妹妹仔" → dịch "bé" (tiếng Quảng, là cách gọi đặc trưng của anh)
      - Sau khi kết hôn còn được gọi: phu nhân Tống, Thẩm lão bản

  - id: "ml_tong_bac_le"
    name_original: "宋泊礼"
    name_translated: "Tống Bạc Lễ"
    name_short: "Tống Bạc Lễ"
    aliases:
      - original: "宋董"
