    gender: "male"
    role: "male_lead"
    age: "26 (đầu truyện) → 30+ (cuối truyện)"
    occupation: "Thừa kế Tống thị tập đoàn, chủ thương hiệu Eternal, sáng lập Ưu Nghệ truyền thông"
    personality: "Bề ngoài lạnh lùng, lý trí, phong độ thần sĩ. Bên trong si tình, chấp niệm. Ban đầu coi nhẹ tình cảm, sau khi mất mới hiểu giá trị, dốc hết sức truy đuổi."
    appearance: "Cao, tuấn lãng, ngũ quan sắc sảo, phong thái quý tộc"
    first_appearance: "chapter_0001"

    self_reference:
      default: "tôi"
      formal: "tôi"
      intimate: "anh"
      internal: "anh"

    notes: |
      - Biển số xe: Cảng 1 (港1) — biểu tượng quyền lực tối thượng Hồng Kông
      - Cách gọi đặc trưng cho nữ chính: "妹妹仔" (bé) — tiếng Quảng Đông
      - Ban đầu coi cô là "trẻ con", sau này "bé" trở thành lời yêu thương
      - Tên trang viên anh mua: 心蔷 (Tâm Tường) = "trong sâu thẳm trái tim, là Thẩm Tường"
      - Hút xì gà, uống rượu, đua ngựa — phong cách thượng lưu Hồng Kông
      - Ngoài miệng bình thản "ok, good luck" nhưng thực ra không buông được

